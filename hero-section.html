<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorful Hero Section</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-card: rgba(15, 23, 42, 0.65);
        --primary: #7c3aed;
        --secondary: #22d3ee;
        --accent: #f97316;
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 30%, #312e81 100%);
        color: var(--text);
      }

      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(30px);
        opacity: 0.7;
      }

      .hero::before {
        width: 360px;
        height: 360px;
        background: rgba(34, 211, 238, 0.35);
        top: 80px;
        left: 8%;
      }

      .hero::after {
        width: 420px;
        height: 420px;
        background: rgba(249, 115, 22, 0.28);
        bottom: 60px;
        right: 8%;
      }

      .container {
        position: relative;
        z-index: 1;
        width: min(1200px, 100%);
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 40px;
        align-items: center;
      }

      .content {
        padding: 20px 10px;
      }

      .tag {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(124, 58, 237, 0.18);
        border: 1px solid rgba(167, 139, 250, 0.5);
        color: #ddd6fe;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        font-size: clamp(2.8rem, 5vw, 5rem);
        line-height: 1.05;
        margin: 22px 0 18px;
        letter-spacing: -2px;
      }

      .highlight {
        background: linear-gradient(90deg, var(--secondary), #a78bfa, #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .description {
        max-width: 560px;
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
        margin-bottom: 30px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        padding: 15px 28px;
        border-radius: 14px;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        color: var(--white);
        box-shadow: 0 15px 35px rgba(34, 211, 238, 0.35);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--white);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .stats {
        margin-top: 34px;
        display: flex;
        gap: 26px;
        flex-wrap: wrap;
      }

      .stat {
        min-width: 120px;
      }

      .stat strong {
        display: block;
        font-size: 1.7rem;
        color: var(--white);
      }

      .stat span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .visual {
        display: flex;
        justify-content: center;
      }

      .card {
        width: min(430px, 100%);
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.7));
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 30px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.55);
        padding: 22px;
        backdrop-filter: blur(12px);
      }

      .dashboard {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 24px;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .chart {
        height: 180px;
        background: linear-gradient(180deg, rgba(124, 58, 237, 0.18), rgba(34, 211, 238, 0.06));
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        margin-bottom: 18px;
      }

      .chart::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          rgba(148, 163, 184, 0.15) 1px,
          transparent 1px
        );
        background-size: 30px 100%;
      }

      .chart::after {
        content: "";
        position: absolute;
        left: 10%;
        right: 10%;
        bottom: 18%;
        height: 58%;
        border-radius: 35% 35% 0 0;
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.9), rgba(124, 58, 237, 0.7));
        clip-path: polygon(0 100%, 0 58%, 18% 66%, 34% 42%, 48% 60%, 62% 34%, 73% 48%, 100% 16%, 100% 100%);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .mini {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 16px;
        padding: 14px 12px;
      }

      .mini .label {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        margin-bottom: 8px;
      }

      .mini strong {
        color: var(--white);
        font-size: 1.15rem;
      }

      .mini:nth-child(1) strong { color: #67e8f9; }
      .mini:nth-child(2) strong { color: #c4b5fd; }
      .mini:nth-child(3) strong { color: #fdba74; }

      @media (max-width: 820px) {
        .container {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .content {
          padding-top: 10px;
        }

        .description {
          margin-left: auto;
          margin-right: auto;
        }

        .actions,
        .stats {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="container">
        <div class="content">
          <span class="tag">Creative growth</span>
          <h1>
            Build a <span class="highlight">brighter</span><br />
            future online.
          </h1>
          <p class="description">
            Turn ideas into stunning digital experiences with strategy, design,
            and growth-driven solutions built for ambitious brands.
          </p>

          <div class="actions">
            <a href="#" class="btn btn-primary">Get Started</a>
            <a href="#" class="btn btn-secondary">View Demo</a>
          </div>

          <div class="stats">
            <div class="stat">
              <strong>12k+</strong>
              <span>Users</span>
            </div>
            <div class="stat">
              <strong>4.9/5</strong>
              <span>Rating</span>
            </div>
            <div class="stat">
              <strong>96%</strong>
              <span>Retention</span>
            </div>
          </div>
        </div>

        <div class="visual">
          <div class="card">
            <div class="dashboard">
              <div class="chart"></div>
              <div class="mini-grid">
                <div class="mini">
                  <span class="label">Traffic</span>
                  <strong>+38%</strong>
                </div>
                <div class="mini">
                  <span class="label">Leads</span>
                  <strong>2.4k</strong>
                </div>
                <div class="mini">
                  <span class="label">Sales</span>
                  <strong>$86k</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
